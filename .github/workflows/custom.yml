# 배경 그림과 말풍선을 골라 커스텀 테마 한 벌을 만든다.
# Actions 탭 > 커스텀 테마 제작 > Run workflow.
#
# 저장소를 포크했으면 자기 포크에서 돌리면 된다. 결과는 Artifacts 에 zip 으로 붙는다.
# 릴리스로 나가는 테마가 아니라서 서명 키를 새로 만들어 쓴다 — 같은 이름으로 다시
# 만들어도 서명이 달라지므로, 폰에서는 먼저 지우고 깔아야 한다.
name: 커스텀 테마 제작

on:
  workflow_dispatch:
    inputs:
      bg:
        description: '배경 그림을 가져올 테마 (받기 링크 이름, 예: camp-dark-image)'
        required: true
        default: 'camp-dark-image'
      bubble:
        description: '말풍선과 색을 가져올 테마 (예: bakery-light)'
        required: true
        default: 'bakery-light'
      accent:
        description: '포인트색 #RRGGBB. 비우면 말풍선 테마 것을 쓴다'
        required: false
        default: ''
      name:
        description: '폰 테마 목록에 뜰 이름'
        required: true
        default: '내 테마'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    # 빌드 스크립트가 aapt2.exe / apksigner.bat 를 부른다. 안드로이드 SDK 도 러너에 깔려 있다
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow

      - name: 소스 만들기
        shell: pwsh
        env:
          BG: ${{ inputs.bg }}
          BUBBLE: ${{ inputs.bubble }}
          ACCENT: ${{ inputs.accent }}
          NAME: ${{ inputs.name }}
        run: python tools/mix.py --bg "$env:BG" --bubble "$env:BUBBLE" --accent "$env:ACCENT" --name "$env:NAME"

      - name: 포장
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build-one.ps1 -Theme build-src\custom -Dist dist

      - name: 미리보기 같이 담기
        shell: pwsh
        run: Copy-Item build-src\custom\preview.png dist\preview.png

      - uses: actions/upload-artifact@v4
        with:
          name: custom-theme
          path: |
            dist/iOS/custom.ktheme
            dist/android/custom.apk
            dist/preview.png
