# 배경 그림과 말풍선을 골라 커스텀 테마 한 벌을 만든다. 들어오는 길이 둘이다.
#
#   Actions 탭 > 커스텀 테마 제작 > Run workflow   — 저장소 쓰기 권한이 있을 때
#   custom-theme 딱지가 붙은 이슈                  — 계정만 있으면 누구나
#
# 둘째 길이 있는 까닭은 workflow_dispatch 가 쓰기 권한을 요구해서다. 남이 쓰려면
# 포크하고 포크에서 Actions 를 켜야 하는데 비개발자가 갈 길이 아니다. 커스텀 테마
# 제작 페이지가 값을 채운 이슈 폼을 열어 주면 Create 한 번으로 여기까지 온다.
#
# 릴리스로 나가는 테마가 아니라서 서명 키를 새로 만들어 쓴다 — 같은 이름으로 다시
# 만들어도 서명이 달라지므로, 폰에서는 먼저 지우고 깔아야 한다.
name: 커스텀 테마 제작

on:
  workflow_dispatch:
    inputs:
      bg:
        description: '배경 그림을 가져올 테마 (받기 링크 이름, 예: camp-dark-image)'
        required: true
        default: 'camp-dark-image'
      bubble:
        description: '말풍선과 색을 가져올 테마 (예: bakery-light)'
        required: true
        default: 'bakery-light'
      send:
        description: '보낸 말풍선 색 #RRGGBB. 비우면 말풍선 테마 것을 쓴다'
        required: false
        default: ''
      recv:
        description: '받은 말풍선 색 #RRGGBB'
        required: false
        default: ''
      accent:
        description: '포인트색 #RRGGBB. 비우면 말풍선 색을 따라간다'
        required: false
        default: ''
      name:
        description: '폰 테마 목록에 뜰 이름'
        required: true
        default: '내 테마'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  PYTHONUTF8: '1'

jobs:
  build:
    # 아무 이슈에나 빌드를 돌리지 않는다. 딱지는 이슈 폼이 알아서 붙인다
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'custom-theme')
    # 빌드 스크립트가 aapt2.exe / apksigner.bat 를 부른다. 안드로이드 SDK 도 러너에 깔려 있다
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow

      # 이슈 본문은 남이 쓴 것이라 셸에 그대로 넣지 않는다. 검사를 통과한 값만
      # 환경 변수로 나오고, 뒤 단계는 그것만 본다
      - name: 값 정하기
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.issue.body }}
          IN_BG: ${{ inputs.bg }}
          IN_BUBBLE: ${{ inputs.bubble }}
          IN_SEND: ${{ inputs.send }}
          IN_RECV: ${{ inputs.recv }}
          IN_ACCENT: ${{ inputs.accent }}
          IN_NAME: ${{ inputs.name }}
        run: python tools/custominput.py

      - name: 소스 만들기
        shell: pwsh
        run: python tools/mix.py --bg "$env:BG" --bubble "$env:BUBBLE" --send "$env:SEND" --recv "$env:RECV" --accent "$env:ACCENT" --name "$env:NAME"

      - name: 포장
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build-one.ps1 -Theme build-src\custom -Dist dist

      # 파일 이름에 테마 이름을 넣는다. custom.ktheme 로만 나가면 여러 벌 만들었을 때 어느
      # 것이 어느 것인지 알 수 없다. 빌드 폴더 이름(custom)은 그대로 둔다 — 그게 안드로이드
      # 패키지 이름이 되므로 한글이 들어가면 안 된다
      - name: 이름 붙여 모으기
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist\iOS\custom.ktheme "out\$env:NAME (custom).ktheme"
          Copy-Item dist\android\custom.apk "out\$env:NAME (custom).apk"
          Copy-Item build-src\custom\preview.png "out\$env:NAME (custom).png"

      - uses: actions/upload-artifact@v4
        with:
          name: custom-theme
          path: out

      # 이슈로 들어온 사람은 Actions 화면을 볼 줄 모른다. 어디서 받는지 댓글로 알려준다.
      # 한글은 파일로 넘긴다 — gh 에 인자로 주면 깨진다
      - name: 이슈에 답하기
        if: always() && github.event_name == 'issues'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          ISSUE: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ($env:STATUS -eq 'success') {
            $lines = @(
              '다 됐습니다. 받는 법입니다.',
              '',
              "1. [빌드 결과 페이지]($env:RUN) 를 엽니다 (깃허브에 로그인돼 있어야 보입니다)",
              '2. 맨 아래 **Artifacts** 의 `custom-theme` 를 누르면 zip 이 받아집니다',
              '3. zip 을 풀면 안드로이드용 `.apk`, 아이폰용 `.ktheme`, 미리보기 그림이 들어 있습니다',
              '4. `.apk` 를 눌러 설치합니다. 출처를 모르는 앱 설치를 한 번 허용해 줘야 합니다',
              '',
              '테마 목록에 안 뜨면 카카오톡을 완전히 껐다 켜 보세요.'
            )
          } else {
            $lines = @(
              '만들다 실패했습니다. 테마 이름이 [받기 링크 이름](https://github.com/Ruminem/kakaotalk-theme)과 다르거나 색이 `#RRGGBB` 형식이 아닐 때 주로 그렇습니다.',
              '',
              "자세한 것은 [빌드 기록]($env:RUN) 에 남아 있습니다. [커스텀 테마 제작 페이지](https://ruminem.github.io/kakaotalk-theme/docs/make.html)에서 다시 고르고 오시면 칸이 알아서 채워집니다."
            )
          }
          $lines -join "`n" | Out-File -FilePath comment.md -Encoding utf8
          gh issue comment $env:ISSUE --body-file comment.md
          if ($env:STATUS -eq 'success') { gh issue close $env:ISSUE }
