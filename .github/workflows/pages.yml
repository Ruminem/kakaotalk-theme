name: Pages

# 미리보기 페이지와 공유 페이지를 GitHub Pages 로 내보낸다.
#
# 릴리스를 내면 release.ps1 이 이 워크플로를 main 에서 부른다. 그래야 사이트의 files/ 가
# 새 릴리스 자산으로 바뀐다.
#
# 공유 페이지는 fetch 로 .ktheme 바이트를 읽어야 하는데, 릴리스 자산에는
# Access-Control-Allow-Origin 헤더가 없다. api.github.com 입구에는 있지만 최종 목적지인
# release-assets.githubusercontent.com 에는 없고, fetch 는 리다이렉트 매 홉을 검사하므로
# 거기서 막힌다. 그래서 사이트 안에 같은 출처로 한 벌 둔다.
# 저장소에 커밋하는 게 아니다 — dist/ 를 커밋하지 않는다는 규칙은 그대로다.

# release: published 트리거는 쓰지 않는다. 그 런은 태그에서 돌고, github-pages 환경의
# 배포 브랜치 정책이 태그를 거부해서 반드시 실패한다("Tag v0.24.1 is not allowed to
# deploy to github-pages"). 실패해도 릴리스는 그대로 나가므로, 사이트만 조용히 옛 자산에
# 머문다 — iOS 는 Pages 를 거쳐 받으므로 고친 테마가 아닌 것이 깔린다. 0.24 와 0.24.1 이
# 그렇게 나갔다. 대신 release.ps1 이 릴리스를 낸 뒤 main 에서 이 워크플로를 부른다.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 사이트는 저장소 구조를 그대로 옮긴다. docs/ 안의 페이지가 쓰는 ../assets/ 경로가
      # 로컬에서 파일로 열 때와 사이트에서 똑같이 동작한다 — 경로를 두 벌 관리하지 않으려는 것.
      - name: 사이트 구성
        run: |
          mkdir -p _site/docs _site/assets _site/files
          cp docs/index.html docs/share.html docs/make.html docs/themes.json \
             docs/zip.js docs/apksign.js docs/apkmix.js docs/customkey.js \
             docs/template.json docs/acolors.json _site/docs/
          cp assets/*.png assets/*.webp _site/assets/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=docs/">' > _site/index.html

      # iOS 테마는 공유 시트로 보내려고, APK 는 커스텀 테마를 만들 때 그림을 꺼내려고
      # 둔다. 브라우저가 릴리스 자산을 직접 읽을 수 없어서다(CORS 헤더가 없다).
      # 받는 링크는 그대로 릴리스를 가리킨다 — 여기 있는 건 재료다.
      - name: 릴리스 자산 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download --dir _site/files --pattern '*.ktheme' --pattern '*.apk'
          # 커스텀 테마에 못 쓰는 APK 는 버린다. 배경 석 장이 다 있는 테마만 고르게
          # 하므로(docs/themes.json) 나머지는 사이트에 둘 이유가 없다
          python3 - <<'PY'
          import json, os, glob
          keep = {t['slug'] for t in json.load(open('docs/themes.json', encoding='utf-8'))['themes']}
          keep.add('custom-template')
          for p in glob.glob('_site/files/*.apk'):
              if os.path.basename(p)[:-4] not in keep:
                  os.remove(p)
          PY
          echo "내려받은 테마: $(ls -1 _site/files/*.ktheme | wc -l) · APK $(ls -1 _site/files/*.apk | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
