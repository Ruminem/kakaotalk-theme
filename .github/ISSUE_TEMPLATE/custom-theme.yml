# 안드로이드 커스텀 테마를 대신 만들어 주는 창구다.
#
# workflow_dispatch 는 저장소 쓰기 권한이 있어야 눌리므로, 남이 쓰려면 포크하고
# 포크에서 Actions 를 켜야 한다. 비개발자가 갈 수 있는 길이 아니다. 이슈는 계정만
# 있으면 열 수 있고, 이슈 폼은 주소에 값을 실어 미리 채울 수 있다(칸의 id 가 곧
# 쿼리 파라미터다). 그래서 커스텀 테마 제작 페이지가 값을 다 채워 이 폼을 열어 주고,
# 누르는 것은 Create 하나뿐이다.
#
# 칸 이름(label)은 .github/workflows/custom.yml 이 본문에서 값을 뽑는 열쇠다.
# 고치면 tools/custominput.py 의 LABELS 도 같이 고친다.
name: 안드로이드 커스텀 테마 만들어 주세요
description: 고른 배경과 말풍선으로 안드로이드 .apk 와 아이폰 .ktheme 을 만들어 드립니다.
title: '커스텀 테마 만들어 주세요'
labels: [custom-theme]
body:
  - type: markdown
    attributes:
      value: |
        칸이 이미 채워져 있으면 아래 **Create** 만 누르시면 됩니다. 3분쯤 뒤에 받는 곳을 댓글로 알려 드립니다.

        빈 칸으로 오셨다면 [커스텀 테마 제작 페이지](https://ruminem.github.io/kakaotalk-theme/docs/make.html)에서 고르고 오시는 게 빠릅니다.
  - type: input
    id: bg
    attributes:
      label: 배경
      description: 배경 그림을 가져올 테마의 받기 링크 이름
      placeholder: camp-dark-image
    validations:
      required: true
  - type: input
    id: bubble
    attributes:
      label: 말풍선
      description: 말풍선과 색을 가져올 테마의 받기 링크 이름
      placeholder: bakery-light
    validations:
      required: true
  - type: input
    id: send
    attributes:
      label: 보낸 말풍선 색
      description: '#RRGGBB. 비우면 말풍선 테마의 원래 색을 씁니다'
      placeholder: '#B6FF4D'
  - type: input
    id: recv
    attributes:
      label: 받은 말풍선 색
      description: '#RRGGBB'
      placeholder: '#A96BFF'
  - type: input
    id: name
    attributes:
      label: 테마 이름
      description: 폰의 테마 목록에 뜰 이름
      placeholder: 내 테마
