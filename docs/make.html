<!doctype html>
<html lang="ko"><meta charset="utf-8">
<title>커스텀 테마 제작</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  폰에서 배경과 말풍선을 따로 골라 나만의 테마를 만드는 자리.

  왜 브라우저에서 되는가 — 사이트의 files/ 에 테마 .ktheme 가 전부 올라와 있다(pages.yml).
  .ktheme 는 KakaoTalkTheme.css 와 Images/ 를 담은 zip 이고, 배경 그림은 그 안에서
  파일 세 장(채팅방·목록·잠금화면, @2x/@3x 라 여섯 장)일 뿐이다. 그래서 말풍선 쪽 테마를
  통째로 가져와 그 여섯 장만 배경 쪽 테마 것으로 갈아끼우면 섞인 테마가 된다.
  CSS 에서는 테마 이름과 테마 ID 두 줄만 고친다 — ID 를 안 고치면 폰이 원래 테마를
  덮어쓴다.

  세 화면에 배경이 다 있는 테마만 고르게 한다(docs/themes.json 이 그 목록이다).
  없는 쪽을 끼우려면 CSS 에서 -ios-background-image 줄을 넣거나 빼야 하는데, 그건
  브라우저에서 할 일이 아니다. 배경 없는 테마가 좋으면 그 테마를 그냥 받으면 된다.

  안드로이드도 여기서 만든다. 테마가 앱(.apk)이라 서명이 있어야 하는데, 사이트에 올려둔
  템플릿 APK 에 두 테마의 그림을 담고 색과 이름을 덮어쓴 뒤 브라우저가 v2 서명을 붙인다
  (docs/apkmix.js·apksign.js). 서명 열쇠(docs/customkey.js)는 일부러 공개한 것이고,
  나가 있는 테마의 열쇠와는 별개다. 재료가 사이트에 없으면 이슈 폼으로 돌린다
  (`androidFallback`). 자세한 까닭은 CLAUDE.md 의 `커스텀 테마 제작`.

  카톡 인앱 브라우저에서 바로 설치하는 길은 없다. 카톡이 가로채는 것은 사이트에 실제로
  있는 파일의 주소뿐인데, 여기서 만든 것은 blob: 주소라 넘겨줄 것이 없다. 서비스 워커로
  주소를 흉내 내 봤지만 카톡이 그 주소를 웹뷰가 아니라 앱에서 직접 받아 404 가 났다
  (폰에서 확인). 그래서 아이폰은 공유 시트로 채팅방을 한 번 거친다 — 다시 파 보기 전에
  이걸 읽는다. 안드로이드는 파일을 받아 직접 설치하므로 채팅방을 안 거친다.

  미리보기는 방금 받은 그 .ktheme 안의 그림과 CSS 로만 그린다. 팔레트 표를 자바스크립트로
  옮겨 적지 않는다 — 두 벌이 되는 순간 한쪽이 틀리기 시작한다. 말풍선을 늘이는 방식도
  카톡과 같다: cap 자리의 한 줄만 늘인다.

  말풍선 색은 그림을 다시 그리지 않고 색상만 돌린다. 되는 계열은 tools/preview.py 가
  재서 themes.json 에 적어 둔다(지금은 네온 36벌). 자세한 것은 CLAUDE.md 의
  `커스텀 테마 제작 > 말풍선 색`.

  이 파일은 손으로 쓴다. 같은 폴더의 index.html 과 themes.json 은 tools/preview.py 가
  만드는 생성물이다.
-->
<style>
  /* 색은 docs/index.html · share.html 과 같은 값. 사이트가 한 덩어리로 보여야 한다 */
  :root {
    --bg:#0f1115; --surface:#151922; --line:#232833;
    --text:#e6e9ee; --dim:#8b95a3; --accent:#4FD1B0; --on-accent:#0b1a16;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px calc(32px + env(safe-area-inset-bottom));
         background:var(--bg); color:var(--text);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
         -webkit-text-size-adjust:100%; }
  main { max-width:430px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:19px; margin:0; text-align:center; }
  .lead { color:var(--dim); font-size:13px; text-align:center; margin:-8px 0 0; }
  a { color:var(--accent); }

  /* --- 미리보기 --- */
  .stage { position:relative; margin:0 auto; }
  .phone { position:absolute; top:0; left:0; width:402px; height:874px;
           transform-origin:top left; border-radius:30px; overflow:hidden;
           border:1px solid var(--line); background:#222 center/cover no-repeat; }
  .phone .chat { position:absolute; left:0; right:0; bottom:60px; padding:0 12px;
                 display:flex; flex-direction:column; align-items:stretch; }
  .row { display:flex; align-items:flex-end; gap:4px; margin-top:6px; }
  .row.gap { margin-top:12px; }
  .row.send { justify-content:flex-end; }
  .bub { font:16px/22px -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
         max-width:252px; white-space:pre-wrap; background-size:100% 100%;
         background-repeat:no-repeat; }
  .time { font-size:11px; opacity:.75; white-space:nowrap; }
  .bar { position:absolute; left:0; right:0; backdrop-filter:blur(18px);
         -webkit-backdrop-filter:blur(18px); }
  .bar.top { top:0; height:110px; }
  .bar.bot { bottom:0; height:60px; }
  .stage .load { position:absolute; inset:0; display:flex; align-items:center;
                 justify-content:center; background:rgba(15,17,21,.72); color:var(--dim);
                 font-size:13px; border-radius:30px; }

  /* --- 고르기 --- */
  .picks { display:flex; flex-direction:column; gap:8px; }
  button, input { font:inherit; font-family:inherit; }
  .pick { display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px;
          border:1px solid var(--line); background:var(--surface); color:var(--text);
          border-radius:11px; cursor:pointer; text-align:left; }
  .pick img { width:34px; height:34px; border-radius:7px; object-fit:cover;
              object-position:center 30%; background:#222; flex:none; }
  .pick img.wide { width:51px; object-fit:contain; object-position:center; background:none; }
  .pick .who { color:var(--dim); font-size:12px; }
  .pick .what { font-size:14.5px; }
  .pick .col { flex:1; min-width:0; }
  .pick .what, .pick .who { display:block; overflow:hidden; text-overflow:ellipsis;
                            white-space:nowrap; }
  .pick .arrow { color:var(--dim); font-size:12px; flex:none; }
  .pick[hidden] { display:none; }
  .chips { display:flex; gap:3px; flex:none; }
  .chips i { width:15.5px; height:34px; border-radius:5px; background:#333; display:block; }
  .swatch { display:flex; gap:4px; height:46px; }
  .swatch i { flex:1; border-radius:7px; display:block; }
  .card.on .swatch i { outline:2px solid var(--accent); outline-offset:2px; }
  .mixrow { grid-column:1/-1; display:flex; gap:8px; align-items:center;
            color:var(--dim); font-size:13px; }
  .mixrow input[type=color] { width:52px; height:40px; padding:2px; border-radius:9px;
                              border:1px solid var(--line); background:var(--surface); }
  input[type=text] { width:100%; padding:13px 12px; border-radius:11px;
                     border:1px solid var(--line); background:var(--surface);
                     color:var(--text); }
  button.primary { font-size:16px; font-weight:700; padding:15px; width:100%;
                   border-radius:11px; cursor:pointer; border:1px solid var(--accent);
                   background:var(--accent); color:var(--on-accent); }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent);
                                              outline-offset:3px; }
  .msg { text-align:center; font-size:13px; color:var(--dim); margin:0; min-height:1.4em; }
  .foot { color:var(--dim); font-size:12.5px; text-align:center; margin:0; }
  .hint { color:var(--dim); font-size:12px; margin:-2px 2px 0; }
  .foot button { margin-top:9px; padding:12px; width:100%; border-radius:11px;
                 border:1px solid var(--line); background:var(--surface);
                 color:var(--text); font-size:14px; cursor:pointer; }

  /* --- 테마 고르는 시트 --- */
  .sheet { position:fixed; inset:0; background:var(--bg); z-index:9; display:none;
           flex-direction:column; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  .sheet.on { display:flex; }
  .sheet .head { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
  .sheet .head input { flex:1; }
  .sheet .close { padding:13px 14px; border-radius:11px; border:1px solid var(--line);
                  background:var(--surface); color:var(--text); cursor:pointer; }
  .grid { overflow-y:auto; display:grid; gap:10px;
          grid-template-columns:repeat(auto-fill, minmax(95px, 1fr)); align-content:start; }
  .grid .cat { grid-column:1/-1; color:var(--dim); font-size:12px; letter-spacing:.1em;
               margin:6px 0 0; }
  .card { border:0; padding:0; background:none; color:var(--text); cursor:pointer;
          text-align:center; }
  .card img { width:100%; aspect-ratio:402/874; object-fit:cover; object-position:center 32%;
              border-radius:9px; border:1px solid var(--line); display:block; background:#222; }
  /* 말풍선만 그린 장은 가로가 길다. 잘라내지 않고 통째로 보여야 소품이 안 잘린다 */
  .card img.wide { aspect-ratio:224/150; object-fit:contain; object-position:center; }
  .grid.wide { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
  .card.on img { border-color:var(--accent); }
  .card span { display:block; font-size:11.5px; margin-top:4px; color:var(--dim);
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>

<main id="app">
  <h1>커스텀 테마 제작</h1>
  <p class="lead" id="lead">배경과 말풍선을 따로 골라 나만의 테마를 만듦</p>

  <div class="stage" id="stage">
    <div class="phone" id="phone"></div>
    <div class="load" id="load">불러오는 중…</div>
  </div>

  <div class="picks">
    <button class="pick" id="pick-bg">
      <img alt=""><span class="col"><span class="who">배경</span><span class="what"></span></span><span class="arrow">바꾸기 ›</span>
    </button>
    <button class="pick" id="pick-bubble">
      <img alt=""><span class="col"><span class="who">말풍선 모양 · 색</span><span class="what"></span></span><span class="arrow">바꾸기 ›</span>
    </button>
    <button class="pick" id="pick-color" hidden>
      <span class="chips"><i></i><i></i></span><span class="col"><span class="who">말풍선 색</span><span class="what"></span></span><span class="arrow">바꾸기 ›</span>
    </button>
    <input type="text" id="name" maxlength="40" placeholder="테마 이름">
    <p class="hint">이름은 고른 것에서 자동으로 만들어짐. 고쳐 써도 되고, 비우면 다시 자동으로 돌아감</p>
  </div>

  <button class="primary" id="go" disabled>준비 중…</button>
  <p class="msg" id="msg"></p>
  <p class="foot" id="foot"></p>
</main>

<div class="sheet" id="sheet">
  <div class="head">
    <input type="text" id="q" placeholder="테마 이름으로 찾기">
    <button class="close" id="close">닫기</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script type="module">
import { readZip, writeZip, crc32, inflate } from './zip.js';

(function () {
  'use strict';
  var FILES = '../files/', ASSETS = '../assets/';
  var BG_NAMES = ['chatroomBgImage', 'mainBgImage', 'passcodeBgImage'];
  var REPO = 'https://github.com/Ruminem/kakaotalk-theme';

  var $ = function (id) { return document.getElementById(id); };
  var DB = [], pick = { bg: 'camp-dark-image', bubble: 'bakery-light-image',
                        send: null, recv: null };
  // 안드로이드는 나오는 것이 .apk 라 만드는 길도 보내는 길도 다르다. 그래서 맨 위에서 가른다
  var android = /Android/i.test(navigator.userAgent);

  // 말풍선 색 짝. 네온 계열에서 고를 수 있다
  var PAIRS = [
    ['파랑×분홍', '#4D8CFF', '#FF6FD8'], ['하늘×산호', '#6FE3FF', '#FF8A6F'],
    ['민트×자홍', '#4DFFC4', '#E066FF'], ['라임×보라', '#B6FF4D', '#A96BFF'],
    ['노랑×하늘', '#FFD24D', '#6FC8FF'], ['주황×청록', '#FF8A3D', '#4DE0D0'],
    ['분홍×하늘', '#FF3FA4', '#35E0FF'], ['빨강×연두', '#FF4D5E', '#7CFF6B'],
    ['보라×노랑', '#9B6BFF', '#FFE24D'], ['청록×분홍', '#35E0C8', '#FF7AC6'],
    ['자홍×라임', '#FF4DE0', '#A8FF4D'], ['주황×보라', '#FF9A3D', '#B06BFF']
  ];
  var ready = null, token = 0;

  // --- 테마 받아두기 -------------------------------------------------------
  var cache = new Map();
  function load(slug) {
    if (!cache.has(slug)) {
      cache.set(slug, fetch(FILES + slug + '.ktheme', { cache: 'force-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(readZip)
        .catch(function (e) { cache.delete(slug); throw e; }));
    }
    return cache.get(slug);
  }

  // --- 섞기 ---------------------------------------------------------------
  function idOf() {
    // 조합마다 다른 ID 라야 폰에서 원래 테마를 덮어쓰지 않고 따로 선다. 색을 바꾼 것도
    // 다른 조합이다 — 같은 ID 면 색만 다른 두 벌 중 하나만 남는다
    var tint = pick.send || pick.recv
      ? '__' + (pick.send || '').slice(1) + (pick.recv || '').slice(1) : '';
    return 'com.kakao.talk.theme.custom_' +
      pick.bubble.replace(/-/g, '_') + '__' + pick.bg.replace(/-/g, '_') + tint.toLowerCase();
  }

  // --- 말풍선 색 바꾸기 ----------------------------------------------------
  // 브라우저는 말풍선을 다시 그릴 수 없다. 그리는 코드는 파이썬(tools/charbubble.py)에
  // 있다. 대신 이미 그려둔 그림의 색상만 돌린다. 네온관은 색 하나로 그려져 있어서
  // 이걸로 충분하다 — 다시 그린 것과 대조해 보니 채널 차이가 9/255 였다.
  // 어느 테마가 그래도 되는지는 tools/preview.py 가 재서 themes.json 에 적어 둔다.
  //
  // 채도가 아니라 채도x명도로 가른다. 어두운 색은 값이 작아 조금만 기울어도 채도가
  // 높게 나온다 — 네온의 검은 벽 #100C14 가 채도 0.40 이다. tools/mix.py 와 같은 기준이다.
  var MIN_CHROMA = 0.06;

  function rgb2hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (mx === g) h = ((b - r) / d + 2) / 6;
      else h = ((r - g) / d + 4) / 6;
    }
    return [h, mx ? d / mx : 0, mx];
  }
  function hsv2rgb(h, s, v) {
    h = ((h % 1) + 1) % 1; s = Math.min(1, Math.max(0, s)); v = Math.min(1, Math.max(0, v));
    var i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s),
        q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    var r = [v, q, p, p, t, v][i % 6], g = [t, v, v, q, p, p][i % 6],
        b = [p, p, t, v, v, q][i % 6];
    return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
  }
  function hexHsv(hex) {
    var n = parseInt(hex.slice(1), 16);
    return rgb2hsv(n >> 16 & 255, n >> 8 & 255, n & 255);
  }
  function hexOf(r, g, b) {
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
  }

  // 원래 색 -> 새 색 짝에서 (색상 차이, 채도 비율) 을 뽑아 둔다
  function colorMap() {
    var row = find(pick.bubble);
    if (!row || !row.send || !(pick.send || pick.recv)) return null;
    var m = [];
    [[row.send, pick.send], [row.recv, pick.recv]].forEach(function (p) {
      var a = hexHsv(p[0]), b = hexHsv(p[1] || p[0]);
      m.push({ h: a[0], shift: b[0] - a[0], k: a[1] ? b[1] / a[1] : 1 });
    });
    return m;
  }

  function gap(a, b) { var d = Math.abs(a - b) % 1; return Math.min(d, 1 - d); }

  function moveColor(map, h, s, v) {
    var best = map[0];
    for (var i = 1; i < map.length; i++) {
      if (gap(h, map[i].h) < gap(h, best.h)) best = map[i];
    }
    return [h + best.shift, s * best.k, v];
  }

  function recolorData(d, map) {
    var p = d.data;
    for (var i = 0; i < p.length; i += 4) {
      if (!p[i + 3]) continue;
      var c = rgb2hsv(p[i], p[i + 1], p[i + 2]);
      if (c[1] * c[2] < MIN_CHROMA) continue;
      var n = moveColor(map, c[0], c[1], c[2]);
      var o = hsv2rgb(n[0], n[1], n[2]);
      p[i] = o[0]; p[i + 1] = o[1]; p[i + 2] = o[2];
    }
    return d;
  }

  function recolorCss(css, map) {
    return css.replace(/#([0-9A-Fa-f]{6})\b/g, function (all, hx) {
      var c = hexHsv('#' + hx);
      if (c[1] * c[2] < MIN_CHROMA) return all;
      var n = moveColor(map, c[0], c[1], c[2]);
      var o = hsv2rgb(n[0], n[1], n[2]);
      return hexOf(o[0], o[1], o[2]);
    });
  }

  function recolorImage(img, map) {
    var c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    var x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    x.putImageData(recolorData(x.getImageData(0, 0, c.width, c.height), map), 0, 0);
    return c;
  }

  // 그림 한 장을 색 돌려 PNG 바이트로 다시 뽑는다
  function recolorPng(rec, map) {
    return png(rec).then(function (img) {
      return new Promise(function (ok) {
        recolorImage(img, map).toBlob(function (b) {
          b.arrayBuffer().then(function (ab) { ok(new Uint8Array(ab)); });
        }, 'image/png');
      });
    });
  }

  function mix(bub, bg, name) {
    var map = colorMap();
    return inflate(bub.get('KakaoTalkTheme.css')).then(function (raw) {
      var css = new TextDecoder().decode(raw);
      if (map) css = recolorCss(css, map);
      css = css
        .replace(/(-kakaotalk-theme-name:\s*')[^']*(')/, '$1' + name + '$2')
        .replace(/(-kakaotalk-theme-id:\s*')[^']*(')/, '$1' + idOf() + '$2');
      var out = new TextEncoder().encode(css);
      var swap = {};
      BG_NAMES.forEach(function (n) {
        ['@2x', '@3x'].forEach(function (x) {
          var k = 'Images/' + n + x + '.png';
          if (bg.has(k)) swap[k] = bg.get(k);
        });
      });
      var items = [], jobs = [];
      bub.forEach(function (rec, key) {
        if (key === 'KakaoTalkTheme.css') {
          items.push({ name: key, method: 0, crc: crc32(out),

          jobs.push(recolorPng(rec, map).then(function (b) {
            item.method = 0; item.data = b; item.crc = crc32(b);
            item.csize = item.usize = b.length;
          }));

      });

    });

    var sx = [0, L, L + 1], sw = [L, 1, R], dx = [0, L, c.width - R], dw = [L, c.width - L - R, R];
    var sy = [0, T, T + 1], sh = [T, 1, B], dy = [0, T, c.height - B], dh = [T, c.height - T - B, B];
    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) {

      var spec = {};

                          ins: insets(b, /-ios-group-title-edgeinsets:\s*(\d+)px\s+(\d+)px\s+(\d+)px\s+(\d+)px/),

    // 소품이 있는 계열은 색상을 돌리면 그 소품까지 같이 돌아서 뺐다(themes.json 이 정한다)

  var apkCache = new Map(), apkParts = null;

  var file = null;

  // 거기서 바로 읽혀야 한다 — 여러 벌 만들어 두면 `내 테마` 가 여럿이 된다.

  function fillGrid(q) {

  function send() {
    if (!file) return;
    if (!canShare) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = fileName();
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
      $('msg').textContent = android
        ? '받았음. 받은 파일을 눌러 설치하면 됨.'
        : '받았음. 폰으로 옮겨 카카오톡에 보내면 설치됨.';
      return;
    }
    // share() 는 탭이 만든 일시적 활성화를 소비한다. 그래서 파일을 미리 만들어두고
    // 다 될 때까지 단추를 잠가둔다 — 누른 뒤에 만들면 느린 폰에서 NotAllowedError 가 난다
    navigator.share({ files: [file] }).then(function () {
      $('msg').textContent = '보냈음. 채팅방에서 파일을 눌러 설치하면 됨.';
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      $('msg').textContent = '공유가 안 됨. 사파리에서 열면 됨.';
    });
  }

  // --- 시작 ---------------------------------------------------------------
  if (typeof DecompressionStream !== 'function') {
    $('app').innerHTML = '<h1>커스텀 테마 제작</h1>' +
      '<p class="lead">이 브라우저에서는 안 됨. iOS 16.4 이상의 사파리나 최신 크롬에서 열면 됨.</p>' +
      '<p class="foot"><a href="' + REPO + '">저장소로 가기</a></p>';
    return;
  }

  // 고른 값을 실어 이슈 폼을 연다. 칸의 id 가 곧 쿼리 파라미터라 눌러야 할 것이
  // Create 하나만 남는다 — 포크도 쓰기 권한도 필요 없다. 안드로이드 재료가 아직 사이트에
  // 없거나(릴리스 전) 색까지 바꾸고 싶을 때 이리로 보낸다
  function issueUrl() {
    var q = ['template=custom-theme.yml', 'bg=' + encodeURIComponent(pick.bg),
      'bubble=' + encodeURIComponent(pick.bubble),
      'name=' + encodeURIComponent(nameOf())];
    if (pick.send) q.push('send=' + encodeURIComponent(pick.send));
    if (pick.recv) q.push('recv=' + encodeURIComponent(pick.recv));
    return REPO + '/issues/new?' + q.join('&');
  }

  // 안드로이드 재료를 못 받았을 때 돌아갈 자리. 릴리스가 한 번 나가기 전까지는 늘 여기다
  function androidFallback(e) {
    file = null;
    $('go').disabled = true;
    $('go').textContent = '여기선 아직 안 됨';
    $('foot').innerHTML = '<b>이 브라우저에서 만들 재료가 아직 사이트에 없음.</b> ' +
      '고르는 건 여기서 하고, 아래 단추를 누르면 고른 값이 채워진 신청 창이 열림 — ' +
      '<b>Create</b> 만 누르면 3분쯤 뒤에 받는 곳을 댓글로 알려줌.' +
      '<br><button id="toapk">깃허브에 만들어 달라고 하기</button>' +
      '<br><small>깃허브 계정이 있어야 함. 로그인창이 떠도 고른 값은 안 날아감. ' +
      '(' + (e && e.message ? e.message : e) + ')</small>';
    wireIssue();
  }
  function wireIssue() {
    if ($('toapk')) {
      $('toapk').addEventListener('click', function () { window.open(issueUrl(), '_blank'); });
    }
  }

  if (android) {
    $('lead').textContent = '배경과 말풍선을 따로 골라 나만의 테마를 만듦';
    $('foot').innerHTML = '만든 뒤 <b>받은 파일을 눌러 설치</b>하면 됨. 출처를 모르는 앱 ' +
      '설치를 한 번 허용해 줘야 함.<br><small>말풍선 색 바꾸기는 아이폰에서만 됨. ' +
      '안드로이드 말풍선은 늘어나는 자리가 그림 안에 구워져 있어서 색만 돌릴 수가 없음.' +
      '</small><button id="toapk">색까지 바꾸려면 깃허브에 맡기기</button>';
  } else if (/KAKAOTALK/i.test(navigator.userAgent)) {
    $('foot').innerHTML = '<b>카카오톡 안에서 열었음.</b> 골라 보는 건 되지만, 여기서 만든 ' +
      '테마는 넘겨줄 주소가 없어서 바로 못 깖 — 오른쪽 위 <b>⋮ → 다른 브라우저로 열기</b> 로 ' +
      '사파리에서 열면 됨.';
  } else {
    $('foot').innerHTML = '여기서는 아이폰 테마(.ktheme)가 나옴. 안드로이드 테마는 ' +
      '안드로이드 폰에서 이 쪽을 열면 <b>.apk</b> 로 나옴.';
  }
  wireIssue();
  $('pick-bg').addEventListener('click', function () { openSheet('bg'); });
  $('pick-bubble').addEventListener('click', function () { openSheet('bubble'); });
  $('pick-color').addEventListener('click', function () { openSheet('color'); });
  $('close').addEventListener('click', closeSheet);
  $('q').addEventListener('input', function () { fillGrid(this.value.trim()); });
  $('grid').addEventListener('click', function (e) {
    var c = e.target.closest('.card');
    if (!c) return;
    if (picking === 'color') {
      var row = find(pick.bubble);
      var orig = c.dataset.send === row.send && c.dataset.recv === row.recv;
      pick.send = orig ? null : c.dataset.send;
      pick.recv = orig ? null : c.dataset.recv;
    } else {
      pick[picking] = c.dataset.slug;
      // 말풍선을 바꾸면 고른 색은 버린다. 그 색은 앞 테마의 색을 기준으로 돌린 것이라
      // 다른 말풍선에 그대로 씌우면 엉뚱한 색이 나온다
      if (picking === 'bubble') pick.send = pick.recv = null;
    }
    closeSheet();
    refresh();
  });
  var timer = null;
  $('name').addEventListener('input', function () {
    // 비우면 다시 자동으로 돌아간다. 자동으로 돌리는 단추를 따로 두지 않아도 되는 자리다
    autoNaming = this.value.trim() === '';
    clearTimeout(timer);
    timer = setTimeout(refresh, 400);
  });
  $('go').addEventListener('click', send);
  window.addEventListener('resize', fit);

  fit();
  fetch('themes.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DB = d.themes;
      // 골라둔 기본값이 없어지거나 말풍선으로 못 쓰게 된 경우 — 목록이 원본이다
      if (!find(pick.bg)) pick.bg = DB[0].slug;
      var b = find(pick.bubble);
      if (!b || !b.bubble) {
        pick.bubble = DB.filter(function (t) { return t.bubble; })[0].slug;
      }
      refresh();
    })
    .catch(function () {
      $('load').textContent = '테마 목록을 못 읽음';
      $('msg').innerHTML = '<a href="' + REPO + '">저장소로 가기</a>';
    });
})();
</script>
</html>
